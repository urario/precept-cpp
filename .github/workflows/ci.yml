name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux GCC
            os: ubuntu-latest
            cmake_args: -DCMAKE_CXX_COMPILER=g++
            check_no_tests: true
            needs_libcxx: false
          - name: Linux Clang
            os: ubuntu-latest
            cmake_args: -DCMAKE_CXX_COMPILER=clang++
            check_no_tests: false
            needs_libcxx: false
          - name: Windows MSVC
            os: windows-latest
            cmake_args: ''
            check_no_tests: false
            needs_libcxx: false
          # GCC ships its own libasan/libubsan, so it is the sanitizer build here rather than
          # Clang, which needs a compiler-rt package this image does not guarantee.
          - name: Linux GCC (Sanitizers)
            os: ubuntu-latest
            cmake_args: '-DCMAKE_CXX_COMPILER=g++ "-DCMAKE_CXX_FLAGS=-fsanitize=address,undefined -fno-omit-frame-pointer -fno-sanitize-recover=all" "-DCMAKE_EXE_LINKER_FLAGS=-fsanitize=address,undefined"'
            check_no_tests: false
            needs_libcxx: false
          # The only libc++ coverage in the matrix; verified locally to actually link libc++.so,
          # not silently fall back to libstdc++.
          - name: Linux Clang (libc++)
            os: ubuntu-latest
            cmake_args: '-DCMAKE_CXX_COMPILER=clang++ "-DCMAKE_CXX_FLAGS=-stdlib=libc++"'
            check_no_tests: false
            needs_libcxx: true
          # No macOS hardware is available to the maintainer; this job is the only basis for
          # calling macOS supported (ADR-0007's CI-verified definition), so it is required, not
          # advisory.
          - name: macOS AppleClang
            os: macos-latest
            cmake_args: ''
            check_no_tests: false
            needs_libcxx: false

    steps:
      - uses: actions/checkout@v7

      - name: Install libc++
        if: matrix.needs_libcxx
        run: sudo apt-get update && sudo apt-get install -y libc++-dev libc++abi-dev

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      # Development-only dependency of the knowledge checker; never a consumer requirement.
      - name: Install knowledge check dependencies
        run: python -m pip install --disable-pip-version-check pyyaml==6.0.3

      # PRECEPT_REQUIRE_KNOWLEDGE_CHECK turns a missing interpreter or missing PyYAML into a
      # configure error, so the knowledge tests can never silently disappear from a green run.
      - name: Configure
        run: >-
          cmake -S . -B build
          -DBUILD_TESTING=ON
          -DCMAKE_BUILD_TYPE=Debug
          -DPRECEPT_REQUIRE_KNOWLEDGE_CHECK=ON
          ${{ matrix.cmake_args }}

      - name: Build
        run: cmake --build build --config Debug --parallel

      - name: Test
        run: ctest --test-dir build -C Debug --output-on-failure

      # Disposable compile spike for Issue #41. This branch is not a production implementation.
      - name: Configure Issue 41 Gate C spike
        run: >-
          cmake -S spikes/issue-41 -B build-issue-41
          -DCMAKE_BUILD_TYPE=Debug
          ${{ matrix.cmake_args }}

      - name: Build Issue 41 Gate C spike
        run: cmake --build build-issue-41 --config Debug --parallel

      - name: Test Issue 41 Gate C spike
        run: ctest --test-dir build-issue-41 -C Debug --output-on-failure

      - name: Configure without tests
        if: matrix.check_no_tests
        run: cmake -S . -B build-no-tests -DBUILD_TESTING=OFF -DCMAKE_BUILD_TYPE=Debug

      - name: Build without tests
        if: matrix.check_no_tests
        run: cmake --build build-no-tests --config Debug --parallel

  format:
    name: clang-format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install clang-format
        run: sudo apt-get update && sudo apt-get install -y clang-format

      - name: Check formatting
        run: >-
          clang-format --dry-run --Werror
          $(bash tools/list_public_headers.sh) tests/*.cpp tests/negative/*.cpp examples/*.cpp

  clang-tidy:
    name: clang-tidy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install clang-tidy
        run: sudo apt-get update && sudo apt-get install -y clang-tidy

      # BUILD_TESTING=ON so compile_commands.json carries real flags for the translation units
      # that include the public headers (GoogleTest fetched by FetchContent must be on disk for
      # clang-tidy to resolve those includes).
      - name: Configure
        run: >-
          cmake -S . -B build
          -DCMAKE_CXX_COMPILER=clang++
          -DBUILD_TESTING=ON
          -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_EXPORT_COMPILE_COMMANDS=ON

      - name: Build
        run: cmake --build build --parallel

      # Scoped to the public headers, not tests/examples: bugprone-unchecked-optional-access
      # cannot see through GoogleTest's ASSERT_TRUE/EXPECT_TRUE narrowing and flags every
      # validated optional access in the test suite as a false positive.
      - name: clang-tidy
        run: clang-tidy -p build $(bash tools/list_public_headers.sh)
